name: Validate MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override v3's default: the obsolete "tools" package is no longer available.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build Android and run client/API checks
        working-directory: android
        run: bash ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gas-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server -v
      - run: python scripts/smoke_http.py
      - run: python scripts/generate_project.py
      - run: git diff --exit-code -- Gas.xcodeproj
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_project.py
      - run: plutil -lint Gas/Info.plist Gas.xcodeproj/project.pbxproj
      - name: Check Debug and Release server address policies
        run: bash scripts/check_server_address.sh
      - name: Build for iOS Simulator
        run: xcodebuild -project Gas.xcodeproj -scheme Gas -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
