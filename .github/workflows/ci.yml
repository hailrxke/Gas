name: Validate MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server -v
      - run: python scripts/smoke_http.py
      - run: python scripts/generate_project.py
      - run: git diff --exit-code -- Gas.xcodeproj
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_project.py
      - run: plutil -lint Gas/Info.plist Gas.xcodeproj/project.pbxproj
      - name: Build for iOS Simulator
        run: xcodebuild -project Gas.xcodeproj -scheme Gas -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
